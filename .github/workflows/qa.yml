name: QA

# The database suites already decide their own verdict: db/run_qa.ps1 exits
# non-zero on a regression, and also when a known issue starts passing or
# reports fewer findings than db/qa_known_issues.txt excuses. So this
# workflow does not re-implement any judgement -- it provides a Postgres
# and calls the runner.
#
# The point of running it here is that the suites are otherwise manual. A
# gate nobody runs between changes is not a gate, and this repository has
# already seen a defect (the search_path class) hide behind 213 green
# assertions for the whole life of the project.

on:
  push:
  pull_request:
  workflow_dispatch:

# a second push to the same branch makes the first run irrelevant
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: database suites
    runs-on: ubuntu-latest

    services:
      postgres:
        # Pinned to the major version the schema requires. Several
        # constraints need 15 or newer -- ON DELETE SET NULL (column) on
        # memberships, in particular -- and the project is developed
        # against 18, so anything older would fail while loading 01_.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # without the health check the first psql can race the server's
        # startup and fail for a reason that has nothing to do with the tests
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Report the environment
        run: |
          psql --version
          pwsh --version
          PGPASSWORD=postgres psql -h localhost -U postgres -tAc "SELECT version();"
        # A version mismatch between client and server is the first thing
        # to suspect if a suite fails here but passes locally, so it is
        # printed before anything runs rather than dug out afterwards.

      - name: Run every suite
        env:
          PGPASSWORD: postgres
        # citext and dblink are created by the SQL itself (01_ and
        # qa_concurrency respectively) and both ship with the official
        # image, so there is nothing to install.
        #
        # -PsqlPath overrides the Windows default in the runner's param
        # block; everything else it needs comes from PGPASSWORD.
        run: pwsh ./db/run_qa.ps1 -PsqlPath psql -User postgres -DbHost localhost -Port 5432

  api:
    name: api
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      # The API tests run against the REAL schema, not a stub. Every
      # refusal they assert -- a duplicate participation code, a category
      # that does not exist -- is enforced by a constraint in this file,
      # and testing against a fake would prove only that the fake agrees
      # with itself.
      - name: Load the schema
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres rocodefest_test
          psql -h localhost -U postgres -d rocodefest_test -v ON_ERROR_STOP=1 -q -f db/00_app_schema.sql
          psql -h localhost -U postgres -d rocodefest_test -v ON_ERROR_STOP=1 -q -f db/01_oltp_schema.sql

      - name: Install
        run: npm ci
        working-directory: api

      - name: Run the API tests
        working-directory: api
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: rocodefest_test
        run: npm test

  migrations:
    name: migrations reach the same schema
    runs-on: ubuntu-latest
    # A database with data in it cannot be rebuilt, so db/migrations/
    # exists to bring an old one forward. That leaves two descriptions of
    # the same schema -- the from-scratch files and the migration chain --
    # and nothing makes them agree by itself. Somebody adds a column to
    # 01_oltp_schema.sql and forgets the migration, or writes the
    # migration and forgets the schema file, and the first anyone hears
    # of it is a deploy that behaves differently from every test.
    #
    # So this job builds BOTH and compares the structure:
    #
    #   A   the current commit, from scratch
    #   B   the PREVIOUS commit, from scratch, then migrated forward
    #
    # If the migrations are right, B ends up identical to A. Git supplies
    # the "before" for free, so no frozen copy of the schema has to be
    # kept in the repository and kept honest.

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # depth 2, because the whole job is a comparison with HEAD~1
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Build A -- current schema, from scratch
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres schema_a
          for f in 00_app_schema.sql 01_oltp_schema.sql 02_analytics_schema.sql 03_etl.sql; do
            psql -h localhost -U postgres -d schema_a -v ON_ERROR_STOP=1 -q -f "db/$f"
          done

      - name: Build B -- previous schema, then migrate forward
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres schema_b
          mkdir -p /tmp/prev
          # The first commit that introduced migrations has no 00_ in its
          # parent, and a file that did not exist yet is not an error --
          # it is exactly the state a migration is supposed to repair.
          for f in 00_app_schema.sql 01_oltp_schema.sql 02_analytics_schema.sql 03_etl.sql; do
            if git cat-file -e "HEAD~1:db/$f" 2>/dev/null; then
              git show "HEAD~1:db/$f" > "/tmp/prev/$f"
              psql -h localhost -U postgres -d schema_b -v ON_ERROR_STOP=1 -q -f "/tmp/prev/$f"
            else
              echo "HEAD~1 nu avea db/$f -- se sare"
            fi
          done
          pwsh db/migrate.ps1 -Database schema_b
        # If HEAD~1 cannot be resolved at all -- the very first commit on
        # a branch built with a shallow clone -- the job fails loudly
        # rather than passing on a comparison it did not make.

      - name: Compare the structures
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d schema_a -q -f db/schema_fingerprint.sql > /tmp/a.txt
          psql -h localhost -U postgres -d schema_b -q -f db/schema_fingerprint.sql > /tmp/b.txt
          echo "A (de la zero):        $(wc -l < /tmp/a.txt) linii"
          echo "B (migrat inainte):    $(wc -l < /tmp/b.txt) linii"
          if diff -u /tmp/a.txt /tmp/b.txt; then
            echo ""
            echo "Cele doua cai dau aceeasi structura."
          else
            echo ""
            echo "DIVERGENTA: migrarile nu duc schema precedenta la cea curenta."
            echo "  < lipseste dintr-o baza migrata (migrare uitata)"
            echo "  > exista in plus intr-o baza migrata (fisier de schema uitat)"
            exit 1
          fi

  frontend:
    name: page contracts
    runs-on: ubuntu-latest
    # No database, no browser, no npm install -- this is static analysis
    # over the page source, so it needs nothing but pwsh and the node the
    # runner already has. It runs as its own job rather than a step of the
    # build below, so a broken link and a compile error are told apart at
    # a glance.
    steps:
      - uses: actions/checkout@v5
      - name: Check the pages against each other and the server
        run: pwsh ./qa_frontend.ps1

  build:
    name: site builds
    runs-on: ubuntu-latest
    # The pages are a Next.js app. `next build` type-checks every page and
    # prerenders all of them, so a page that does not compile or throws
    # while rendering fails here rather than on the Vercel deploy.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

# WHAT NO JOB COVERS
# ------------------
# The behaviour of the page scripts in a browser. Each page's logic is in
# a PageScript.jsx beside it, and none of it is executed here -- doing so
# needs a headless browser, which is a dependency and a decision rather
# than an oversight.
#
# What IS covered is the contract the pages keep with each other and with
# the server: the links between them, who decides sign-in, and what is
# still kept in the browser. Those are where the findings turned out to be.
